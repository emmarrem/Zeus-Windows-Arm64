name: Windows ARM64 release

on:
  workflow_dispatch:
    inputs:
      validate_current:
        description: "Build and test the current upstream release without publishing"
        type: boolean
        default: false
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-arm64-release.yml
      - packaging/windows/arm64-call-media.patch
      - packaging/windows/arm64-runtime.patch
      - packaging/windows/arm64-updates.patch
      - assets/zeus-arm64-update-public-key.hex

permissions:
  contents: read

concurrency:
  group: windows-arm64-release
  cancel-in-progress: false

env:
  UPSTREAM: ItIsNotKeshav/Zeus
  TARGET: aarch64-pc-windows-msvc
  UPDATE_KEY: assets/zeus-arm64-update-public-key.hex
  VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_current }}
  BUILD_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_current && 'fast' || 'release' }}

jobs:
  discover:
    if: github.repository == 'emmarrem/Zeus-Windows-Arm64' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - name: Find an upstream stable release that needs a signed installer
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/$UPSTREAM/releases/latest")
          tag=$(jq -er 'select(.draft == false and .prerelease == false) | .tag_name' <<< "$release")
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream stable tag: $tag" >&2
            exit 1
          fi

          asset="zeus-$tag-$TARGET-setup.exe"
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if [[ $VALIDATION_ONLY != true ]] && jq -e --arg tag "$tag" --arg asset "$asset" '
            flatten | any(.tag_name == $tag and .draft == false and .prerelease == false
              and any(.assets[]; .name == $asset and .state == "uploaded")
              and any(.assets[]; .name == "checksums.txt" and .state == "uploaded")
              and any(.assets[]; .name == "checksums.txt.sig" and .state == "uploaded" and .size == 64))
          ' <<< "$releases" >/dev/null; then
            echo "$tag is already published with its signed ARM64 installer."
            exit 0
          fi

          commit=$(gh api "repos/$UPSTREAM/commits/$tag" --jq .sha)
          [[ $commit =~ ^[0-9a-f]{40}$ ]]
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    if: needs.discover.outputs.tag != ''
    needs: discover
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ needs.discover.outputs.tag }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.discover.outputs.commit }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: fork-release
          persist-credentials: false
          sparse-checkout: |
            assets/zeus-arm64-update-public-key.hex
            packaging/windows/arm64-call-media.patch
            packaging/windows/arm64-runtime.patch
            packaging/windows/arm64-updates.patch
          sparse-checkout-cone-mode: false

      - name: Apply the Windows ARM64 runtime and update changes
        run: |
          git apply --ignore-space-change fork-release/packaging/windows/arm64-runtime.patch `
            fork-release/packaging/windows/arm64-call-media.patch `
            fork-release/packaging/windows/arm64-updates.patch
          if ($LASTEXITCODE -ne 0) { throw "The ARM64 patches could not be applied to upstream $env:TAG" }
          Copy-Item -LiteralPath "fork-release/$env:UPDATE_KEY" -Destination $env:UPDATE_KEY

      - name: Build Zeus with the native ARM64 toolchain
        run: |
          $version = $env:TAG.Substring(1)
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version = "([^"\r\n]+)"\r?$' -or $Matches[1] -ne $version) {
            throw "Cargo.toml version does not match $env:TAG"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { throw 'Visual Studio ARM64 C++ tools are missing' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=arm64 -host_arch=arm64'

          $env:CMAKE_GENERATOR = 'NMake Makefiles'
          $env:CARGO_NET_GIT_FETCH_WITH_CLI = 'true'
          $toolchain = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $toolchain -notcontains "host: $env:TARGET") {
            throw "Expected a native Rust host for $env:TARGET"
          }
          cargo test --locked --profile $env:BUILD_PROFILE --features demo,eframe/wgpu `
            --target $env:TARGET --lib camera::backend::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --profile $env:BUILD_PROFILE --features demo,eframe/wgpu --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and smoke-test the ARM64 installer
        run: |
          $version = $env:TAG.Substring(1)
          $binary = "$PWD\target\$env:TARGET\$env:BUILD_PROFILE\zeus.exe"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" '/DArch=aarch64' "/DBinary=$binary" `
            "/DOutputDir=$PWD\dist" packaging\windows\zeus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $name = "zeus-$env:TAG-$env:TARGET-setup.exe"
          $setup = "$PWD\dist\$name"
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $installed = "$env:LOCALAPPDATA\Programs\Zeus\zeus.exe"
          $pe = [IO.BinaryReader]::new([IO.File]::OpenRead($installed))
          try {
            $pe.BaseStream.Position = 0x3c
            $pe.BaseStream.Position = $pe.ReadInt32()
            if ($pe.ReadUInt32() -ne 0x4550 -or $pe.ReadUInt16() -ne 0xaa64) {
              throw 'Installed zeus.exe is not a native ARM64 PE executable'
            }
          } finally {
            $pe.Dispose()
          }

          $payload = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($installed))
          $updateKey = (Get-Content -Raw -LiteralPath $env:UPDATE_KEY).Trim()
          if (-not $payload.Contains($env:GITHUB_REPOSITORY) -or -not $payload.Contains($updateKey)) {
            throw 'Installed Zeus does not contain the fork update channel and public key'
          }

          $stdout = "$env:RUNNER_TEMP\zeus-version.txt"
          $probe = Start-Process -FilePath $installed -ArgumentList '--version' -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -Wait -PassThru
          if ($probe.ExitCode -ne 0 -or (Get-Content $stdout -Raw).Trim() -ne "zeus $version") {
            throw "Installed Zeus did not report version $version"
          }

          $shot = "$env:RUNNER_TEMP\zeus-arm64-render.png"
          $render = Start-Process -FilePath $installed -WindowStyle Hidden -PassThru `
            -ArgumentList @('--demo-shot', ('"' + $shot + '"'), '--demo-size', '800x600')
          if (-not $render.WaitForExit(45000)) {
            if (-not $render.HasExited) { $render.Kill(); $render.WaitForExit() }
            throw 'The installed ARM64 Zeus did not finish rendering its DirectX 12 demo'
          }
          if ($render.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $shot -PathType Leaf)) {
            throw "The installed ARM64 Zeus failed the DirectX 12 render check (exit $($render.ExitCode))"
          }
          $png = [IO.File]::ReadAllBytes($shot)
          if ($png.Length -lt 1024 -or [Convert]::ToHexString($png, 0, 8) -ne '89504E470D0A1A0A') {
            throw 'The DirectX 12 demo did not produce a valid PNG'
          }
          Write-Host 'Installed ARM64 Zeus rendered its offline demo using DirectX 12.'

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  $name`n" | Set-Content -Encoding ascii -NoNewline dist/checksums.txt
          if ($env:VALIDATION_ONLY -eq 'true') {
            Copy-Item -LiteralPath $installed -Destination dist/zeus-call-media-test.exe
            $testHash = (Get-FileHash -Algorithm SHA256 -LiteralPath dist/zeus-call-media-test.exe).Hash.ToLowerInvariant()
            "$testHash  zeus-call-media-test.exe`n" | Set-Content -Encoding ascii -NoNewline dist/test-exe.sha256
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.validate_current && 'zeus-windows-arm64-validation' || 'zeus-windows-arm64' }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [discover, build]
    if: github.event_name != 'workflow_dispatch' || !inputs.validate_current
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.discover.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.discover.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: fork-release
          persist-credentials: false
          sparse-checkout: assets/zeus-arm64-update-public-key.hex
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: zeus-windows-arm64
          path: dist

      - name: Sign and verify the installer checksum
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.ZEUS_ARM64_UPDATE_SIGNING_KEY }}
        run: |
          asset="zeus-$TAG-$TARGET-setup.exe"
          test -s "dist/$asset"
          [[ $(cat dist/checksums.txt) == "$(cd dist && sha256sum "$asset")" ]]
          if [[ -z $SIGNING_KEY ]]; then
            echo 'ZEUS_ARM64_UPDATE_SIGNING_KEY is missing.' >&2
            exit 1
          fi
          public_key="$RUNNER_TEMP/zeus-arm64-update-key.pem"
          openssl pkey -in <(printf '%s\n' "$SIGNING_KEY") -pubout -out "$public_key"
          actual=$(openssl pkey -pubin -in "$public_key" -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          expected=$(tr -d '[:space:]' < "fork-release/$UPDATE_KEY")
          if [[ ! $expected =~ ^[0-9a-f]{64}$ || $actual != "$expected" ]]; then
            echo 'The signing secret does not match the embedded public key.' >&2
            exit 1
          fi
          openssl pkeyutl -sign -inkey <(printf '%s\n' "$SIGNING_KEY") -rawin \
            -in dist/checksums.txt -out dist/checksums.txt.sig
          test "$(wc -c < dist/checksums.txt.sig)" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$public_key" -rawin \
            -in dist/checksums.txt -sigfile dist/checksums.txt.sig

      - name: Publish as the latest stable release
        run: |
          asset="zeus-$TAG-$TARGET-setup.exe"
          export GH_REPO="$GITHUB_REPOSITORY"
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Native Windows ARM64 build of Zeus $TAG for Snapdragon and other Windows on Arm devices.

          Download and run \`$asset\` for your first installation or to switch an older copy to this fork's update channel. The installer uses your existing Zeus installation and settings.

          Once you install this build, future signed releases appear in Zeus under **Settings → General → About**. Zeus verifies \`checksums.txt.sig\` before downloading the installer.

          This ARM64 build uses DirectX 12. Frosted glass effects use solid surfaces on this renderer.

          The GitHub release tag points to the fork's main branch. The installer is built from the exact upstream source linked below, with this fork's ARM64 patches.

          [Upstream release notes](https://github.com/$UPSTREAM/releases/tag/$TAG) · [Upstream source](https://github.com/$UPSTREAM/commit/$SOURCE_COMMIT) · [ARM64 build configuration](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) · [Build log](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          EOF

          if ! jq -e --arg tag "$TAG" 'flatten | any(.tag_name == $tag)' <<< "$releases" >/dev/null; then
            # GitHub can create a release tag on the fork's default branch with contents: write.
            gh release create "$TAG" --target "$GITHUB_REF_NAME" --draft \
              --title "Zeus $TAG for Windows ARM64" --notes-file "$notes"
          fi
          gh release upload "$TAG" "dist/$asset" dist/checksums.txt dist/checksums.txt.sig --clobber
          gh release edit "$TAG" --draft=false --prerelease=false --latest --notes-file "$notes"
          latest=$(gh api "repos/$GH_REPO/releases/latest")
          jq -e --arg tag "$TAG" --arg asset "$asset" '
            select(.tag_name == $tag and .draft == false and .prerelease == false
              and any(.assets[]; .name == $asset and .state == "uploaded")
              and any(.assets[]; .name == "checksums.txt" and .state == "uploaded")
              and any(.assets[]; .name == "checksums.txt.sig" and .state == "uploaded" and .size == 64))
            | .html_url
          ' <<< "$latest"
